<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LQD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">
        <span class="logo__main">LQD</span>
        <span class="logo__sub">WATER & HEAT</span>
      </a>

      <nav class="nav">
        <a href="#">Послуги</a>
        <a href="#">Чому LQD</a>
        <a href="#">Контакти</a>
      </nav>

      <a href="#" class="header__btn">
        Direct
        <span class="header__btn-icon">➤</span>
      </a>

      <button class="header__menu" aria-label="Відкрити меню"><span></span><span></span><span></span></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero__glow hero__glow--two"></div>

    <div class="hero__content">
      <h1 class="hero__title">
        Один сервіс<br>
        для <span>всіх систем</span><br>
        будинку
      </h1>

      <p class="hero__text">
        Обслуговування опалення,<br>
        водоочистки та свердловин<br>
        у Київській області
      </p>

      <div class="hero__buttons">
        <a href="https://t.me/vllsn_a" class="btn btn--primary">
          <span class="btn__icon">▣</span>
          Отримати консультацію
        </a>

        <a href="#" class="btn btn--secondary">
          <span class="btn__icon">▦</span>
          Наші послуги
        </a>
      </div>

      <div class="hero__stats">
        <div class="hero__stat">
          <span class="hero__stat-icon">♢</span>
          <span class="hero__stat-text">
            <strong>10 років</strong>
            <small>досвіду</small>
          </span>
        </div>

        <div class="hero__stat">
          <span class="hero__stat-icon">◎</span>
          <span class="hero__stat-text">
            <strong>400+</strong>
            <small>клієнтів</small>
          </span>
        </div>

        <div class="hero__stat">
          <span class="hero__stat-icon">✧</span>
          <span class="hero__stat-text">
            <strong>Авторизований</strong>
            <small>сервіс</small>
          </span>
        </div>
      </div>

      <div class="hero__photo-slot" aria-label="Місце для фото будинку">
        <div class="hero__photo-line hero__photo-line--one"></div>
        <div class="hero__photo-line hero__photo-line--two"></div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
